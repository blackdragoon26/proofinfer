# CI for proofinfer.
#
# Three jobs, and the split is the point: the cheap correctness checks are
# separate from the expensive differential ones, so a reviewer opening this file
# can see at a glance what each guarantee rests on.
#
#   rust          fmt, clippy, unit/integration tests, the zero-dependency
#                 assertion, and a mutation sweep proving those tests can
#                 fail. The slowest step is the sweep, which rebuilds the
#                 crate 21 times.
#   differential  the six-config comparison against PyTorch, then the mutation
#                 check that proves the comparison can fail.
#   real-weights  the same comparison against a genuinely trained
#                 stories15M checkpoint, on a 200-token sequence chosen by the
#                 reference decoder.
#   proof         the Verus development in verus/, plus a check that it still
#                 describes the code it claims to describe. Added after the
#                 proof landed; the other three are unchanged.
#
# There is no `continue-on-error` and no `|| true` anywhere in this file, and
# there will not be. A test that cannot fail is worse than no test, because it
# is a claim of confidence with nothing behind it. If a job here goes red, the
# correct response is to find the bug, not to soften the check.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref. This does not make anything pass
# conditionally; it only avoids spending runner minutes on commits that have
# already been superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # One place to change the toolchain, so the three Rust jobs agree. The `proof`
  # job deliberately does not use this: Verus is built against one specific
  # rustc, prints the exact `rustup install` line for it when it is missing, and
  # installs that instead. Pinning RUSTUP_TOOLCHAIN here would hand Verus a
  # toolchain it cannot use.
  RUST_TOOLCHAIN: stable

jobs:
  # ---------------------------------------------------------------------------
  rust:
    name: rust (fmt, clippy, tests, zero deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # Python is only for the mutation sweep at the end of this job, but
      # pinning the version is cheaper than relying on whatever the runner
      # image happens to ship.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Asserted before anything else runs. If a dependency ever sneaks in, the
      # build should stop here rather than at the end of a long pipeline, and
      # the message should say exactly which packages appeared.
      #
      # The count is taken with awk rather than `grep -c ... || true`. grep
      # exits 1 when it finds nothing, which is the *expected* result for an
      # empty file, and the usual ways of papering over that are exactly the
      # `|| true` this repository forbids. awk exits 0 either way, so no
      # escape hatch is needed.
      - name: Assert zero external dependencies
        run: |
          set -euo pipefail
          count=$(awk '/^\[\[package\]\]/{n++} END{print n+0}' Cargo.lock)
          if [ "$count" -ne 1 ]; then
            echo "::error::Cargo.lock must contain exactly one package, found ${count}"
            awk '/^\[\[package\]\]/{getline n; print n}' Cargo.lock
            exit 1
          fi
          if ! grep -q '^name = "proofinfer"$' Cargo.lock; then
            echo "::error::the only package in Cargo.lock must be proofinfer itself"
            cat Cargo.lock
            exit 1
          fi
          echo "Cargo.lock contains exactly one package: proofinfer"

      # --locked fails if Cargo.lock is out of date with Cargo.toml, which is
      # what stops a dependency change from being quietly committed without the
      # lock file.
      - name: Build (locked)
        run: cargo build --release --locked

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --release -- -D warnings

      # Both profiles on purpose. Debug enables integer overflow checks, and
      # the loader's checked_mul arithmetic is exactly where a wrapping
      # computation would hide. A test that only ever runs in release never
      # sees that.
      - name: Test (release)
        run: cargo test --release --locked

      - name: Test (debug, overflow checks on)
        run: cargo test --locked

      # The job that justifies the one above.
      #
      # `cargo test` passing says the suite agrees with the code. It does not
      # say the suite can *notice* disagreement. This injects 21 realistic bugs
      # one at a time and requires `cargo test` to fail on every one, which is
      # the difference between "75 tests" and "75 tests that would catch 21
      # known defects".
      #
      # It found two real holes when it was first run, and both are now fixed:
      # the RoPE tests were all structural invariants satisfied by *any*
      # frequencies, so `2 * i` -> `i` passed every one of them; and nothing
      # covered generation's BOS termination, which is the bug the byte-identity
      # check found by hand.
      - name: Prove the test suite can fail
        run: python reference/mutation_check_tests.py

  # ---------------------------------------------------------------------------
  differential:
    name: differential (vs PyTorch) + mutation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # CPU-only torch. The CUDA wheel is several gigabytes and this job never
      # touches a GPU, so the CPU index is both faster and more honest about
      # what is being tested.
      - name: Install numpy and CPU torch
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy torch \
            --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple

      - name: Build
        run: cargo build --release --locked

      # Six configurations: MHA, two levels of GQA, MQA, an untied classifier,
      # and a 128-token context. Each is exported with the reference's own
      # legacy_export, run through PyTorch, and run through the engine.
      - name: Differential test
        run: python reference/diff_test.py

      # Injects ten realistic bugs and requires the harness above to fail on
      # every one. This is what makes the previous step mean something: a
      # comparison that has never failed is equally consistent with "correct"
      # and with "cannot detect anything".
      - name: Mutation check
        run: python reference/mutation_check.py

  # ---------------------------------------------------------------------------
  real-weights:
    name: real weights (stories15M)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install numpy and CPU torch
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy torch \
            --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple

      # 60 MB, so it is cached rather than re-fetched. The key includes the
      # URL, which means a different checkpoint busts the cache automatically.
      - name: Cache stories15M.pt
        id: stories-cache
        uses: actions/cache@v4
        with:
          path: stories15M.pt
          key: stories15M-https-huggingface-co-karpathy-tinyllamas-resolve-main-stories15M-pt

      - name: Download stories15M.pt
        if: steps.stories-cache.outputs.cache-hit != 'true'
        run: |
          curl -fSL --retry 3 --retry-delay 5 -o stories15M.pt \
            https://huggingface.co/karpathy/tinyllamas/resolve/main/stories15M.pt

      - name: Build
        run: cargo build --release --locked

      # A genuinely trained 15M-parameter Llama, with real weight distributions
      # and a 32000-entry vocabulary, on a 200-token sequence chosen by the
      # reference greedy decoder rather than by us. The random-weight suite
      # proves the arithmetic; this proves the engine runs real weights.
      - name: Differential test on real weights
        run: python reference/diff_test.py --checkpoint stories15M.pt -n 200

  # ---------------------------------------------------------------------------
  proof:
    name: proof (Verus + citation drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The cheapest and most important step in this job.
      #
      # `verus/kv_cache_bounds.rs` is a *model* of the indexing arithmetic;
      # `src/ops.rs` and `src/model.rs` contain no `verus!` macro and are never
      # compiled by Verus. So a green Verus run does not by itself prove the
      # proof still matches the code. This check closes that gap for the likely
      # failure mode: it verifies that every source line the proof cites still
      # contains the construct it is cited for. Change `h / kv_mul` to anything
      # else, or refactor and shift the line numbers, and this goes red.
      - name: Check the proof still describes the current source
        run: python verus/check_citations.py

      # 485 MB, so it is cached rather than re-fetched on every push. The key
      # includes the Verus version, so bumping Verus busts the cache.
      - name: Cache the Verus release
        id: verus-cache
        uses: actions/cache@v4
        with:
          path: verus-dist
          key: >-
            verus-0.2026.09.20.aef82ed-x86-linux
            -7b870fa12bc589015c2fab60a8b3d9f07c7b1adb3444eb0fadffcbf7f0447b33

      - name: Fetch and unpack Verus
        if: steps.verus-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -fSL --retry 3 --retry-delay 5 -o verus.zip \
            'https://github.com/verus-lang/verus/releases/download/release%2F0.2026.09.20.aef82ed/verus-0.2026.09.20.aef82ed-x86-linux.zip'
          # Pinned to the digest GitHub publishes for this asset, so the 485 MB
          # download is verified rather than trusted. `sha256sum` rather than
          # `shasum` because the runner is ubuntu and sha256sum is the one
          # guaranteed by coreutils there.
          echo '7b870fa12bc589015c2fab60a8b3d9f07c7b1adb3444eb0fadffcbf7f0447b33  verus.zip' \
            | sha256sum --check --strict -
          mkdir -p verus-dist
          unzip -q verus.zip -d verus-dist

      - name: Locate the Verus binary
        # The archive's internal directory name is not part of its contract, so
        # find the binary rather than hardcoding a path that a release could
        # rename out from under us.
        id: verus-bin
        run: |
          set -euo pipefail
          bin=$(find verus-dist -type f -name verus -perm -u+x | head -1)
          if [ -z "$bin" ]; then
            echo "::error::no executable named 'verus' inside the archive"
            find verus-dist -maxdepth 2 | head -20
            exit 1
          fi
          echo "Found Verus at $bin"
          echo "path=$bin" >> "$GITHUB_OUTPUT"

      - name: Install the toolchain Verus requires
        run: |
          set -euo pipefail
          bin=${{ steps.verus-bin.outputs.path }}
          # Verus exits non-zero and prints the exact `rustup install` line for
          # the toolchain it was built against. Parse that rather than
          # hardcoding a version, so a Verus bump cannot silently leave CI
          # running against the wrong toolchain - or, worse, skipping the proof.
          #
          # The ANSI colour codes are stripped first. They are not cosmetic
          # here: Verus indents the `rustup install` line and wraps the command
          # in an escape sequence, so a `sed` anchored at the start of the line
          # after whitespace matches nothing and the step would fail with
          # "could not determine which toolchain Verus requires". Verified
          # against real output rather than assumed.
          clean=$("$bin" --version 2>&1 | sed 's/\x1b\[[0-9;]*m//g')
          need=$(printf '%s\n' "$clean" \
            | sed -n 's/^[[:space:]]*rustup install \([^[:space:]]*\).*$/\1/p' | head -1)
          if [ -z "$need" ]; then
            echo "::error::could not determine which toolchain Verus requires"
            printf '%s\n' "$clean"
            exit 1
          fi
          echo "Verus requires: $need"
          rustup toolchain install "$need"

      # --no-cheating rejects assume, admit and external_body, so "24 verified,
      # 0 errors" is a claim about the file rather than a comment in it.
      - name: Verify the KV-cache index-safety proof
        run: |
          set -euo pipefail
          ${{ steps.verus-bin.outputs.path }} \
            --crate-type lib --no-cheating verus/kv_cache_bounds.rs
