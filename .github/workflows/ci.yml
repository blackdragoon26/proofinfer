# CI for proofinfer.
#
# Six jobs, and the split is the point: the cheap correctness checks are
# separate from the expensive differential ones, so a reviewer opening this file
# can see at a glance what each guarantee rests on.
#
#   rust                 fmt, clippy, release + debug tests, the zero-dependency
#                        and Cargo.lock v3 assertion, and a mutation sweep
#                        proving those tests can fail.
#   msrv                 release build + test suite on the documented minimum
#                        supported Rust version (1.70.0).
#   site-and-provenance  vendored reference SHA-256 verification and all static
#                        site parity, contrast, and motion checks.
#   differential         the six-config comparison against PyTorch, then the
#                        mutation check that proves the comparison can fail.
#   real-weights         the same comparison against a genuinely trained
#                        stories15M checkpoint (200 tokens), plus byte-identical
#                        output verification against Karpathy's C run.c.
#   proof                bidirectional citation drift + self-test, followed by
#                        Verus `--no-cheating` verification of verus/.
#
# There is no `continue-on-error` and no `|| true` anywhere in this file, and
# there will not be. A test that cannot fail is worse than no test, because it
# is a claim of confidence with nothing behind it. If a job here goes red, the
# correct response is to find the bug, not to soften the check.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref. This does not make anything pass
# conditionally; it only avoids spending runner minutes on commits that have
# already been superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # One place to change the toolchain for the stable Rust jobs. The `msrv` job
  # pins 1.70.0 explicitly, and the `proof` job uses its own isolated
  # RUSTUP_HOME because Verus requires one specific rustc release.
  RUST_TOOLCHAIN: stable

jobs:
  # ---------------------------------------------------------------------------
  rust:
    name: rust (fmt, clippy, tests, zero deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # Python is only for the mutation sweep at the end of this job, but
      # pinning the version is cheaper than relying on whatever the runner
      # image happens to ship.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Asserted before anything else runs. If a dependency ever sneaks in, or
      # if Cargo.lock is silently bumped to v4 (breaking Rust 1.70.0), the
      # build should stop here with an exact diagnostic.
      #
      # The count is taken with awk rather than `grep -c ... || true` so no
      # escape hatch is needed.
      - name: Assert zero external dependencies and Cargo.lock v3
        run: |
          set -euo pipefail
          count=$(awk '/^\[\[package\]\]/{n++} END{print n+0}' Cargo.lock)
          if [ "$count" -ne 1 ]; then
            echo "::error::Cargo.lock must contain exactly one package, found ${count}"
            awk '/^\[\[package\]\]/{getline n; print n}' Cargo.lock
            exit 1
          fi
          if ! grep -q '^name = "proofinfer"$' Cargo.lock; then
            echo "::error::the only package in Cargo.lock must be proofinfer itself"
            cat Cargo.lock
            exit 1
          fi
          if ! grep -q '^version = 3$' Cargo.lock; then
            echo "::error::Cargo.lock must stay at version = 3 for Rust 1.70.0 MSRV"
            head -10 Cargo.lock
            exit 1
          fi
          echo "Cargo.lock is version 3 and contains exactly one package: proofinfer"

      # --locked fails if Cargo.lock is out of date with Cargo.toml, which is
      # what stops a dependency change from being quietly committed without the
      # lock file.
      - name: Build (locked)
        run: cargo build --release --locked

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --release -- -D warnings

      # Both profiles on purpose. Debug enables integer overflow checks, and
      # the loader's checked_mul arithmetic is exactly where a wrapping
      # computation would hide. A test that only ever runs in release never
      # sees that.
      - name: Test (release)
        run: cargo test --release --locked

      - name: Test (debug, overflow checks on)
        run: cargo test --locked

      # The job that justifies the one above.
      #
      # `cargo test` passing says the suite agrees with the code. It does not
      # say the suite can *notice* disagreement. This injects 21 realistic bugs
      # one at a time and requires `cargo test` to compile cleanly and fail at
      # least one test on every one.
      - name: Prove the test suite can fail
        run: python reference/mutation_check_tests.py

  # ---------------------------------------------------------------------------
  msrv:
    name: msrv (Rust 1.70.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.70.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.70.0"

      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv-1.70.0

      - name: Build (locked)
        run: cargo build --release --locked

      - name: Test (debug, locked)
        run: cargo test --locked

  # ---------------------------------------------------------------------------
  site-and-provenance:
    name: site + vendored provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Verify vendored llama2.c provenance
        run: python reference/check_provenance.py

      - name: Check static site parity, contrast, and motion
        run: |
          set -euo pipefail
          python site/sync.py --check
          python site/check_docs.py
          python site/check_light.py
          node site/motion_test.js

  # ---------------------------------------------------------------------------
  differential:
    name: differential (vs PyTorch) + mutation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: reference/requirements.txt

      # CPU-only torch pinned in reference/requirements.txt (`torch<2.6` keeps
      # vendored llama2c/export.py's torch.load working without editing it).
      - name: Install numpy and CPU torch
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r reference/requirements.txt \
            --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple

      - name: Build
        run: cargo build --release --locked

      # Six configurations: MHA, two levels of GQA, MQA, an untied classifier,
      # and a 128-token context. Each is exported with the reference's own
      # legacy_export, run through PyTorch, and run through the engine.
      - name: Differential test
        run: python reference/diff_test.py

      # Injects ten realistic bugs and requires the harness above to fail on
      # every one. This is what makes the previous step mean something: a
      # comparison that has never failed is equally consistent with "correct"
      # and with "cannot detect anything".
      - name: Mutation check
        run: python reference/mutation_check.py

  # ---------------------------------------------------------------------------
  real-weights:
    name: real weights (stories15M + run.c)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: reference/requirements.txt

      - name: Install numpy and CPU torch
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r reference/requirements.txt \
            --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple

      # 60 MB, so it is cached rather than re-fetched. The key includes the
      # URL, which means a different checkpoint busts the cache automatically.
      - name: Cache stories15M.pt
        id: stories-cache
        uses: actions/cache@v4
        with:
          path: stories15M.pt
          key: stories15M-https-huggingface-co-karpathy-tinyllamas-resolve-main-stories15M-pt

      - name: Download stories15M.pt
        if: steps.stories-cache.outputs.cache-hit != 'true'
        run: |
          curl -fSL --retry 3 --retry-delay 5 -o stories15M.pt \
            https://huggingface.co/karpathy/tinyllamas/resolve/main/stories15M.pt

      - name: Build
        run: cargo build --release --locked

      # A genuinely trained 15M-parameter Llama, with real weight distributions
      # and a 32000-entry vocabulary, on a 200-token sequence chosen by the
      # reference greedy decoder rather than by us. Also exports stories15M.bin
      # for the byte-identity check against C run.c below.
      - name: Differential test on real weights
        run: python reference/diff_test.py --checkpoint stories15M.pt -n 200 --export-bin stories15M.bin

      # Compile vendored run.c with -O3 (no -ffast-math) and assert
      # byte-identical greedy output on stories15M.bin.
      - name: Byte-identical check against reference C run.c
        run: |
          set -euo pipefail
          cc -O3 -o run_O3 reference/llama2c/run.c -lm
          python reference/bench.py --model stories15M.bin --runs 1 --run-c ./run_O3

  # ---------------------------------------------------------------------------
  proof:
    name: proof (Verus + citation drift)
    runs-on: ubuntu-latest
    env:
      RUSTUP_HOME: ${{ github.workspace }}/.verus-rustup
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Bidirectional cross-file citation check + self-test proving mutations
      # on either `src/` or `verus/kv_cache_bounds.rs` turn the build red.
      - name: Check the proof still describes the current source
        run: |
          set -euo pipefail
          python verus/check_citations.py --self-test
          python verus/check_citations.py

      # 485 MB, so it is cached rather than re-fetched on every push. The key
      # includes the Verus version and sha256, so bumping Verus busts the cache.
      - name: Cache the Verus release
        id: verus-cache
        uses: actions/cache@v4
        with:
          path: verus-dist
          key: >-
            verus-0.2026.09.20.aef82ed-x86-linux
            -7b870fa12bc589015c2fab60a8b3d9f07c7b1adb3444eb0fadffcbf7f0447b33

      - name: Fetch and unpack Verus
        if: steps.verus-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -fSL --retry 3 --retry-delay 5 -o verus.zip \
            'https://github.com/verus-lang/verus/releases/download/release%2F0.2026.09.20.aef82ed/verus-0.2026.09.20.aef82ed-x86-linux.zip'
          echo '7b870fa12bc589015c2fab60a8b3d9f07c7b1adb3444eb0fadffcbf7f0447b33  verus.zip' \
            | sha256sum --check --strict -
          mkdir -p verus-dist
          unzip -q verus.zip -d verus-dist
          rm -f verus.zip

      - name: Locate the Verus binary
        id: verus-bin
        run: |
          set -euo pipefail
          bin=$(find verus-dist -type f -name verus -perm -u+x | head -1)
          if [ -z "$bin" ]; then
            echo "::error::no executable named 'verus' inside the archive"
            find verus-dist -maxdepth 2 | head -20
            exit 1
          fi
          echo "Found Verus at $bin"
          echo "path=$bin" >> "$GITHUB_OUTPUT"

      - name: Cache Verus rustup toolchain
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.verus-rustup
          key: verus-rustup-0.2026.09.20.aef82ed-x86-linux

      - name: Install the toolchain Verus requires
        run: |
          set -euo pipefail
          bin=${{ steps.verus-bin.outputs.path }}
          set +e
          raw=$("$bin" --version 2>&1)
          verus_status=$?
          set -e
          clean=$(printf '%s\n' "$raw" | sed 's/\x1b\[[0-9;]*m//g')
          printf '%s\n' "$clean"
          if [ "$verus_status" -eq 0 ]; then
            if ! printf '%s\n' "$clean" | grep -q '^Verus$' || \
               ! printf '%s\n' "$clean" | grep -q 'Toolchain:'; then
              echo "::error::verus --version exited 0 without expected Verus/Toolchain output"
              exit 1
            fi
            echo "Verus toolchain already installed in cache"
          else
            need=$(printf '%s\n' "$clean" \
              | sed -n 's/^[[:space:]]*rustup install \([^[:space:]]*\).*$/\1/p' | head -1)
            if [ -z "$need" ]; then
              echo "::error::could not determine which toolchain Verus requires"
              exit 1
            fi
            echo "Verus requires: $need"
            rustup toolchain install "$need"
            "$bin" --version
          fi

      # --no-cheating rejects assume, admit and external_body, so "24 verified,
      # 0 errors" is a claim about the file rather than a comment in it.
      - name: Verify the KV-cache index-safety proof
        run: |
          set -euo pipefail
          ${{ steps.verus-bin.outputs.path }} \
            --crate-type lib --no-cheating verus/kv_cache_bounds.rs
